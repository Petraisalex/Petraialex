name: snake

on:
  schedule:
    - cron: "37 5 * * *"      # once a day, after the stats refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#dd2d51&color_dots=#eff2f5,#f5c2cc,#ee96a8,#e76a83,#dd2d51
            dist/snake-dark.svg?palette=github-dark&color_snake=#e04060&color_dots=#161b22,#562737,#852f45,#b33853,#e04060

      # publishes dist/ to the `output` branch, which the README links to
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
